[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderwatch"
version = "0.3.0"
description = "Local copy of Swiss public procurement data from simap.ch, linked to the commercial register (Zefix)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tenderwatch = "tenderwatch.cli:main"

[tool.setuptools]
packages = ["tenderwatch"]

[tool.setuptools.package-data]
tenderwatch = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
